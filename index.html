<!doctype html>
<html lang="ko">
<head>

<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>동그라미 습관</title>
<style>
:root{--blue:#1687f8;--blue-dark:#0875e8;--bg:#f4f6f8;--card:#fff;--ink:#343a40;--muted:#858d96;--line:#e7ebef;--soft:#f0f3f6;--radius:18px}
*{box-sizing:border-box}html{font-family:"NanumSquare","나눔스퀘어","Apple SD Gothic Neo",Arial,sans-serif;color:var(--ink);background:var(--bg)}body{margin:0;min-height:100vh;background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9bcaff;outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:38px;height:38px;border-radius:13px;background:var(--blue);display:grid;place-items:center;color:white;font-size:22px;font-weight:900;box-shadow:0 5px 12px #1687f82b}.brand h1{font-size:20px;letter-spacing:-.6px;margin:0;font-weight:900}.brand p{font-size:12px;color:var(--muted);margin:4px 0 0}.header-actions{display:flex;gap:7px}.icon-btn{border:1px solid var(--line);background:white;border-radius:12px;min-width:42px;height:42px;padding:0 11px;color:var(--ink);font-size:13px;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat{background:var(--card);border:1px solid #edf0f3;border-radius:16px;padding:15px 16px}.stat-label{font-size:12px;color:var(--muted);font-weight:700}.stat-main{display:flex;align-items:baseline;gap:5px;margin-top:7px}.stat-value{font-size:26px;font-weight:900;letter-spacing:-1px}.stat-unit{font-size:12px;color:var(--muted)}.stat-note{font-size:11px;color:var(--muted);margin-top:4px}
.card{background:var(--card);border:1px solid #edf0f3;border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #27384d05}.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:15px}.month-label{font-size:19px;font-weight:900;letter-spacing:-.5px}.month-nav{display:flex;gap:6px}.month-nav button{width:34px;height:34px;border:1px solid var(--line);background:white;border-radius:11px;font-size:16px;color:var(--ink);display:flex;align-items:center;justify-content:center}
.month-nav button#todayBtn{width:auto;padding:0 12px;font-size:13px;font-weight:800;color:var(--blue);background:#eaf4ff;border-color:#b8d9ff}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;font-size:11px;color:var(--muted);font-weight:800;padding:0 0 7px}.weekday:first-child{color:#e17b85}.weekday:last-child{color:#679de6}.day{min-width:0;min-height:67px;border:1px solid transparent;background:transparent;border-radius:12px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}.day:disabled{cursor:default}.day:not(:disabled):hover{background:#f3f8ff}.day.other{opacity:.28}.day.selected{background:#eaf4ff;border-color:#b8d9ff}.day.today .day-num{background:var(--blue);color:#fff;min-width:25px;height:25px;border-radius:9px;display:grid;place-items:center}.day-num{font-size:12px;font-weight:800;min-width:25px;height:25px;display:grid;place-items:center}.day-dots{display:flex;justify-content:center;align-items:center;gap:3px;flex-wrap:wrap;max-width:100%;min-height:8px}.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid #d9dee4;background:#edf0f3;display:inline-block;flex:none}.dot.due{background:transparent;border-width:1.7px}.dot.done{border-color:var(--dot-color);background:var(--dot-color)}.dot.off{background:#e7ebef;border-color:#e7ebef}.calendar-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:13px;color:var(--muted);font-size:11px}.legend-item{display:flex;align-items:center;gap:5px}.legend-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid #9aa3ad}.legend-dot.fill{background:var(--blue);border-color:var(--blue)}.legend-dot.grey{background:#e7ebef;border-color:#e7ebef}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.section-head h2{font-size:16px;margin:0;font-weight:900}.subtext{font-size:12px;color:var(--muted);margin:5px 0 0}.primary{border:0;border-radius:12px;background:var(--blue);color:#fff;padding:11px 14px;font-size:13px;font-weight:800;box-shadow:0 4px 10px #1687f826}.primary:hover{background:var(--blue-dark)}.secondary{border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);padding:9px 12px;font-size:12px;font-weight:800}.date-title{font-size:15px;font-weight:900}.task-list{display:flex;flex-direction:column;gap:8px}.task{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:14px;padding:12px;background:white;min-height:57px}.task-check{width:23px;height:23px;border:2px solid var(--task-color,#c9d0d8);border-radius:50%;display:grid;place-items:center;flex:none;background:white;color:white;font-size:14px;font-weight:900;padding:0}.task.checked{background:#f7f8fa}.task.checked .task-check{background:var(--task-color);border-color:var(--task-color)}.task-name{font-size:14px;font-weight:800;flex:1;overflow-wrap:anywhere}.task.checked .task-name{color:#a5abb2;text-decoration:line-through;text-decoration-thickness:1.5px}.task-meta{font-size:11px;color:var(--muted);margin-top:4px}.task.checked .task-meta{color:#b0b6bd}.task-edit{border:0;background:transparent;color:#9aa2ab;padding:7px;font-size:17px}.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}.empty strong{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}.habit-manage{display:flex;flex-direction:column;gap:8px}.habit-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f2f4}.habit-row:last-child{border-bottom:0}.habit-swatch{width:12px;height:12px;border-radius:50%;flex:none}.habit-info{min-width:0;flex:1}.habit-title{font-size:13px;font-weight:800;overflow-wrap:anywhere}.habit-frequency{font-size:11px;color:var(--muted);margin-top:4px}.habit-actions{display:flex;gap:4px}.tiny-btn{border:1px solid var(--line);background:white;border-radius:9px;padding:7px 9px;color:#6e7781;font-size:11px;font-weight:800}.footnote{font-size:11px;line-height:1.65;color:var(--muted);text-align:center;margin:16px 10px 0}
.modal-backdrop{position:fixed;inset:0;background:#18233166;display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:0}.modal{background:white;width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px #17263825}.modal h2{margin:0 0 18px;font-size:19px}.field{margin:0 0 15px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.field input[type=text],.field select{width:100%;border:1px solid #dfe4e9;border-radius:11px;padding:12px;background:white;color:var(--ink)}.color-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}.color-choice{height:30px;border-radius:50%;border:2px solid transparent;position:relative}.color-choice.chosen{outline:2px solid var(--blue);outline-offset:2px}.color-choice.chosen:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:900;color:#34404b;text-shadow:0 1px 2px #fff}.schedule-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.schedule-option{border:1px solid var(--line);background:white;border-radius:11px;padding:10px 8px;font-size:12px;font-weight:800;text-align:left}.schedule-option.active{border-color:var(--blue);background:#eff7ff;color:#086ed8}.weekday-picks{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.weekday-pick{width:35px;height:35px;border-radius:50%;border:1px solid var(--line);background:white;color:#68717b;font-size:12px;font-weight:800}.weekday-pick.active{background:var(--blue);border-color:var(--blue);color:white}.modal-actions{display:flex;gap:8px;margin-top:20px}.modal-actions button{flex:1}.danger{color:#d84f5d;border-color:#f2d3d7}.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#303943;color:white;border-radius:12px;padding:11px 15px;font-size:12px;z-index:30;box-shadow:0 5px 20px #0002;max-width:calc(100vw - 32px);text-align:center}.hidden{display:none!important}.file-input{display:none}
@media(min-width:620px){.app{padding-top:28px}.modal-backdrop{align-items:center;padding:18px}.modal{border-radius:22px;padding:24px;max-height:88vh}.day{min-height:76px}.dot{width:9px;height:9px}.stats{gap:12px}.stat{padding:17px 19px}}
@media(max-width:370px){.app{padding-left:10px;padding-right:10px}.card{padding:12px}.day{min-height:59px}.calendar{gap:2px}.dot{width:7px;height:7px}.calendar-legend{gap:8px}.brand h1{font-size:18px}.icon-btn{min-width:36px;padding:0 8px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="brand-mark" aria-hidden="true">○</div><div><h1>동그라미 습관</h1><p>오늘의 작은 체크가 꾸준함이 돼요</p></div></div>
    <div class="header-actions">
      <button class="icon-btn" id="exportBtn" aria-label="기록 백업">백업</button>
      <button class="icon-btn" id="importBtn" aria-label="기록 복원">복원</button>
      <input id="importFile" class="file-input" type="file" accept=".json,application/json">
    </div>
  </header>
  <section class="stats" aria-label="이번 달 통계">
    <div class="stat"><div class="stat-label">이번 달 달성률</div><div class="stat-main"><span class="stat-value" id="rateValue">0%</span></div><div class="stat-note" id="rateNote">체크를 시작해 보세요</div></div>
    <div class="stat"><div class="stat-label">연속 달성</div><div class="stat-main"><span class="stat-value" id="streakValue">0</span><span class="stat-unit">일</span></div><div class="stat-note">예정된 습관을 모두 완료한 날 기준</div></div>
  </section>
  <section class="card">
    <div class="calendar-head"><div class="month-label" id="monthLabel"></div><div class="month-nav"><button id="prevMonth" aria-label="이전 달">‹</button><button id="todayBtn" aria-label="이번 달로 이동">오늘</button><button id="nextMonth" aria-label="다음 달">›</button></div></div>
    <div class="calendar" id="calendar"></div>
    <div class="calendar-legend">
      <span class="legend-item"><i class="legend-dot"></i>예정</span>
      <span class="legend-item"><i class="legend-dot fill"></i>완료</span>
      <span class="legend-item"><i class="legend-dot grey"></i>쉬는 날</span>
      <span class="legend-item">파란 날짜 = 오늘</span>
    </div>
  </section>
  <section class="card">
    <div class="section-head"><div><div class="date-title" id="selectedDateTitle">오늘의 체크리스트</div><p class="subtext" id="selectedDateSub">완료한 습관을 눌러 동그라미를 채워요.</p></div><button class="primary" id="addHabitBtn">＋ 습관 추가</button></div>
    <div class="task-list" id="taskList"></div>
  </section>
  <section class="card">
    <div class="section-head"><div><h2>내 습관</h2><p class="subtext">색과 반복 주기를 자유롭게 바꿀 수 있어요.</p></div><button class="secondary" id="manageAddBtn">＋ 추가</button></div>
    <div class="habit-manage" id="habitManage"></div>
  </section>
  <p class="footnote">기록은 이 브라우저 안에만 저장돼요. 휴대폰을 바꾸거나 브라우저 데이터를 지우기 전에는 백업 파일을 보관해 주세요.</p>
</div>
<div class="modal-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <h2 id="modalTitle">습관 추가</h2>
    <div class="field"><label for="habitName">습관 이름</label><input id="habitName" type="text" maxlength="60" placeholder="예: 퇴근 후 20분 달리기"></div>
    <div class="field"><label>습관 색상</label><div class="color-grid" id="colorGrid"></div></div>
    <div class="field"><label>반복 주기</label><div class="schedule-options" id="scheduleOptions"></div><div id="weekdayArea" class="hidden"><div class="weekday-picks" id="weekdayPicks"></div><p class="subtext" id="weekdayHelp"></p></div></div>
    <div class="modal-actions"><button class="secondary danger hidden" id="deleteHabitBtn">삭제</button><button class="secondary" id="cancelModalBtn">취소</button><button class="primary" id="saveHabitBtn">저장</button></div>
  </div>
</div>
<div class="toast hidden" id="toast" role="status"></div>
<script>
(() => {
'use strict';
const STORAGE_KEY = 'donggeurami-habit-v1';
const COLORS = [
  {name:'노랑',value:'#F4D66D'},{name:'분홍',value:'#F3A9C4'},{name:'빨강',value:'#F28F91'},
  {name:'보라',value:'#C2A6E8'},{name:'파랑',value:'#7DAAF5'},{name:'하늘',value:'#8BD6E8'},
  {name:'갈색',value:'#C49A7A'},{name:'초록',value:'#8CCBA2'},{name:'연두',value:'#C1D982'}
];
const DAYS = ['일','월','화','수','목','금','토'];
const SCHEDULES = [
  {id:'daily',label:'매일'},
  {id:'alternate',label:'격일'},
  {id:'weekly1',label:'주 1회 · 요일 지정'},
  {id:'weekly2',label:'주 2회 · 요일 지정'},
  {id:'weekend',label:'주말만'}
];
let state = loadState();
let shownMonth = new Date(); shownMonth = new Date(shownMonth.getFullYear(), shownMonth.getMonth(), 1);
let selectedDate = dateKey(new Date());
let editingId = null;
let draftColor = COLORS[1].value;
let draftSchedule = 'daily';
let draftDays = [1];
let toastTimer;

const $ = id => document.getElementById(id);
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fromKey(key){const [y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d,12,0,0);}
function todayKey(){return dateKey(new Date());}
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return {version:1,habits:[],checks:{}};
    const data=JSON.parse(raw);
    if(!data || !Array.isArray(data.habits) || !data.checks || typeof data.checks!=='object')return {version:1,habits:[],checks:{}};
    return {version:1,habits:data.habits.filter(h=>h&&typeof h.id==='string'&&typeof h.name==='string'),checks:data.checks};
  }catch(e){return {version:1,habits:[],checks:{}};}
}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));return true;}catch(e){showToast('저장 공간이 부족해요. 백업 후 기록을 정리해 주세요.');return false;}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function habitColor(h){return COLORS.some(c=>c.value===h.color)?h.color:COLORS[1].value;}
function scheduled(h,key){
  const d=fromKey(key), day=d.getDay();
  switch(h.schedule){
    case 'alternate': {
      const start=h.startDate || h.createdAt || key;
      const diff=Math.round((fromKey(key)-fromKey(start))/86400000);
      return diff>=0 && diff%2===0;
    }
    case 'weekly1': return (h.days||[]).includes(day);
    case 'weekly2': return (h.days||[]).includes(day);
    case 'weekend': return day===0||day===6;
    case 'daily': default:return true;
  }
}
function checked(h,key){return !!(state.checks[key]&&state.checks[key][h.id]);}
function toggleCheck(h,key){if(!state.checks[key])state.checks[key]={};if(state.checks[key][h.id])delete state.checks[key][h.id];else state.checks[key][h.id]=true;if(!Object.keys(state.checks[key]).length)delete state.checks[key];persist();render();}
function monthKeys(year,month){const n=new Date(year,month+1,0).getDate();return Array.from({length:n},(_,i)=>dateKey(new Date(year,month,i+1,12)));}
function dayStatus(key){
  const due=state.habits.filter(h=>scheduled(h,key));
  if(!due.length)return {due,done:0,allDone:false,hasDue:false};
  const done=due.filter(h=>checked(h,key)).length;
  return {due,done,allDone:done===due.length,hasDue:true};
}
function monthStats(){
  const now=new Date(), keys=monthKeys(now.getFullYear(),now.getMonth());
  let total=0,done=0;
  for(const key of keys){if(key>todayKey())continue;for(const h of state.habits){if(scheduled(h,key)){total++;if(checked(h,key))done++;}}}
  const rate=total?Math.round(done/total*100):0;
  let streak=0, cursor=fromKey(todayKey());
  if(dayStatus(dateKey(cursor)).hasDue && !dayStatus(dateKey(cursor)).allDone)cursor.setDate(cursor.getDate()-1);
  for(let i=0;i<366;i++){
    const key=dateKey(cursor), status=dayStatus(key);
    if(status.hasDue){if(status.allDone)streak++;else break;}
    cursor.setDate(cursor.getDate()-1);
  }
  return {rate,total,done,streak};
}
function renderStats(){
  const s=monthStats();$('rateValue').textContent=s.rate+'%';$('streakValue').textContent=s.streak;
  $('rateNote').textContent=s.total?`${s.done} / ${s.total}회 완료`:'예정된 습관이 없어요';
}
function renderCalendar(){
  $('monthLabel').textContent=`${shownMonth.getFullYear()}년 ${shownMonth.getMonth()+1}월`;
  const root=$('calendar');root.innerHTML='';
  DAYS.forEach((d,i)=>{const el=document.createElement('div');el.className='weekday';el.textContent=d;root.appendChild(el);});
  const year=shownMonth.getFullYear(),month=shownMonth.getMonth(),first=new Date(year,month,1).getDay(),count=new Date(year,month+1,0).getDate();
  for(let i=0;i<first;i++){const blank=document.createElement('div');blank.className='day other';blank.setAttribute('aria-hidden','true');root.appendChild(blank);}
  for(let n=1;n<=count;n++){
    const d=new Date(year,month,n,12),key=dateKey(d),btn=document.createElement('button');btn.type='button';btn.className='day';
    if(key===todayKey())btn.classList.add('today');if(key===selectedDate)btn.classList.add('selected');
    const num=document.createElement('span');num.className='day-num';num.textContent=n;btn.appendChild(num);
    const dots=document.createElement('span');dots.className='day-dots';
    state.habits.forEach(h=>{
      const isDue=scheduled(h,key);
      if(h.schedule==='alternate'&&!isDue)return;
      const dot=document.createElement('i');dot.className='dot';
      dot.style.setProperty('--dot-color',habitColor(h));
      if(isDue){dot.classList.add('due');dot.style.borderColor=habitColor(h);if(checked(h,key)){dot.classList.remove('due');dot.classList.add('done');}}
      else dot.classList.add('off');
      dot.title=`${h.name}: ${isDue?(checked(h,key)?'완료':'예정'):'쉬는 날'}`;
      dots.appendChild(dot);
    });
    btn.appendChild(dots);btn.setAttribute('aria-label',`${year}년 ${month+1}월 ${n}일`);
    btn.addEventListener('click',()=>{selectedDate=key;render();});
    root.appendChild(btn);
  }
}
function scheduleLabel(h){
  switch(h.schedule){
    case 'alternate':return '격일 반복';
    case 'weekly1':return `주 1회 · ${(h.days||[]).map(d=>DAYS[d]+'요일').join(', ')}`;
    case 'weekly2':return `주 2회 · ${(h.days||[]).map(d=>DAYS[d]+'요일').join(', ')}`;
    case 'weekend':return '토·일 반복';
    default:return '매일 반복';
  }
}
function renderTasks(){
  const date=fromKey(selectedDate);$('selectedDateTitle').textContent=`${date.getMonth()+1}월 ${date.getDate()}일 체크리스트`;
  $('selectedDateSub').textContent=selectedDate===todayKey()?'오늘의 작은 체크를 채워봐요.':'선택한 날짜의 습관을 확인해요.';
  const root=$('taskList');root.innerHTML='';
  const due=state.habits.filter(h=>scheduled(h,selectedDate));
  if(!due.length){
    const div=document.createElement('div');div.className='empty';
    if(!state.habits.length)div.innerHTML='<strong>첫 습관을 만들어 볼까요?</strong>습관을 추가하면 달력에 동그라미가 나타나요.';
    else div.innerHTML='<strong>오늘은 예정된 습관이 없어요.</strong>다른 날짜를 선택하거나 반복 주기를 바꿔보세요.';
    root.appendChild(div);return;
  }
  due.forEach(h=>{
    const done=checked(h,selectedDate),row=document.createElement('div');row.className='task'+(done?' checked':'');row.style.setProperty('--task-color',habitColor(h));
    const check=document.createElement('button');check.className='task-check';check.type='button';check.setAttribute('aria-label',done?`${h.name} 완료 해제`:`${h.name} 완료 체크`);check.textContent=done?'✓':'';
    check.addEventListener('click',()=>toggleCheck(h,selectedDate));
    const info=document.createElement('div');info.style.flex='1';info.innerHTML=`<div class="task-name">${escapeHtml(h.name)}</div><div class="task-meta">${escapeHtml(scheduleLabel(h))}</div>`;
    const edit=document.createElement('button');edit.className='task-edit';edit.type='button';edit.setAttribute('aria-label',`${h.name} 수정`);edit.textContent='⋯';edit.addEventListener('click',()=>openModal(h.id));
    row.append(check,info,edit);root.appendChild(row);
  });
}
function renderManage(){
  const root=$('habitManage');root.innerHTML='';
  if(!state.habits.length){root.innerHTML='<div class="empty"><strong>아직 등록한 습관이 없어요.</strong>위의 ‘습관 추가’ 버튼으로 시작해 보세요.</div>';return;}
  state.habits.forEach(h=>{
    const row=document.createElement('div');row.className='habit-row';
    const sw=document.createElement('span');sw.className='habit-swatch';sw.style.background=habitColor(h);
    const info=document.createElement('div');info.className='habit-info';info.innerHTML=`<div class="habit-title">${escapeHtml(h.name)}</div><div class="habit-frequency">${escapeHtml(scheduleLabel(h))}</div>`;
    const actions=document.createElement('div');actions.className='habit-actions';
    const edit=document.createElement('button');edit.className='tiny-btn';edit.textContent='수정';edit.addEventListener('click',()=>openModal(h.id));
    const del=document.createElement('button');del.className='tiny-btn';del.textContent='삭제';del.addEventListener('click',()=>deleteHabit(h.id));
    actions.append(edit,del);row.append(sw,info,actions);root.appendChild(row);
  });
}
function render(){renderStats();renderCalendar();renderTasks();renderManage();}
function showToast(msg){const el=$('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2600);}
function openModal(id=null){
  editingId=id;const h=id?state.habits.find(x=>x.id===id):null;
  $('modalTitle').textContent=h?'습관 수정':'습관 추가';$('habitName').value=h?h.name:'';
  draftColor=h?habitColor(h):COLORS[1].value;draftSchedule=h?(h.schedule||'daily'):'daily';draftDays=h&&Array.isArray(h.days)?[...h.days]:[1];
  $('deleteHabitBtn').classList.toggle('hidden',!h);renderModalChoices();$('modalBackdrop').classList.remove('hidden');setTimeout(()=>$('habitName').focus(),50);
}
function closeModal(){$('modalBackdrop').classList.add('hidden');editingId=null;}
function renderModalChoices(){
  const colors=$('colorGrid');colors.innerHTML='';
  COLORS.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='color-choice'+(draftColor===c.value?' chosen':'');b.style.background=c.value;b.title=c.name;b.setAttribute('aria-label',c.name);b.addEventListener('click',()=>{draftColor=c.value;renderModalChoices();});colors.appendChild(b);});
  const schedules=$('scheduleOptions');schedules.innerHTML='';
  SCHEDULES.forEach(s=>{const b=document.createElement('button');b.type='button';b.className='schedule-option'+(draftSchedule===s.id?' active':'');b.textContent=s.label;b.addEventListener('click',()=>{draftSchedule=s.id;if(s.id==='weekly1')draftDays=draftDays.length?draftDays.slice(0,1):[1];if(s.id==='weekly2')draftDays=draftDays.length>=2?draftDays.slice(0,2):[1,3];renderModalChoices();});schedules.appendChild(b);});
  const showDays=draftSchedule==='weekly1'||draftSchedule==='weekly2';$('weekdayArea').classList.toggle('hidden',!showDays);
  $('weekdayHelp').textContent=draftSchedule==='weekly1'?'요일을 하나 선택해 주세요.':'요일을 두 개 선택해 주세요.';
  const picks=$('weekdayPicks');picks.innerHTML='';
  DAYS.forEach((day,i)=>{const b=document.createElement('button');b.type='button';b.className='weekday-pick'+(draftDays.includes(i)?' active':'');b.textContent=day;b.setAttribute('aria-label',day+'요일');b.addEventListener('click',()=>{
    if(draftDays.includes(i))draftDays=draftDays.filter(x=>x!==i);
    else if(draftSchedule==='weekly1')draftDays=[i];
    else if(draftDays.length<2)draftDays=[...draftDays,i];
    else {showToast('요일을 두 개까지 선택할 수 있어요.');return;}
    renderModalChoices();
  });picks.appendChild(b);});
}
function saveHabit(){
  const wasEditing=!!editingId;
  const name=$('habitName').value.trim();if(!name){showToast('습관 이름을 입력해 주세요.');$('habitName').focus();return;}
  if((draftSchedule==='weekly1'&&draftDays.length!==1)||(draftSchedule==='weekly2'&&draftDays.length!==2)){showToast(draftSchedule==='weekly1'?'요일을 하나 선택해 주세요.':'요일을 두 개 선택해 주세요.');return;}
  if(editingId){
    const h=state.habits.find(x=>x.id===editingId);if(!h)return;
    h.name=name;h.color=draftColor;h.schedule=draftSchedule;h.days=(draftSchedule==='weekly1'||draftSchedule==='weekly2')?[...draftDays]:[];
  }else{
    const id=(crypto&&crypto.randomUUID)?crypto.randomUUID():`h-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
    state.habits.push({id,name,color:draftColor,schedule:draftSchedule,days:(draftSchedule==='weekly1'||draftSchedule==='weekly2')?[...draftDays]:[],createdAt:todayKey(),startDate:todayKey()});
  }
  persist();closeModal();render();showToast(wasEditing?'습관을 수정했어요.':'새 습관을 추가했어요.');
}
function deleteHabit(id){
  const h=state.habits.find(x=>x.id===id);if(!h)return;
  if(!confirm(`‘${h.name}’ 습관을 삭제할까요?\n이 습관의 체크 기록도 함께 삭제됩니다.`))return;
  state.habits=state.habits.filter(x=>x.id!==id);
  Object.keys(state.checks).forEach(k=>{if(state.checks[k]){delete state.checks[k][id];if(!Object.keys(state.checks[k]).length)delete state.checks[k];}});
  persist();if(editingId===id)closeModal();render();showToast('습관과 해당 기록을 삭제했어요.');
}
function exportData(){
  const payload={app:'동그라미 습관',version:1,exportedAt:new Date().toISOString(),habits:state.habits,checks:state.checks};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`donggeurami-backup-${todayKey()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);showToast('백업 파일을 저장했어요.');
}
function importData(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const d=JSON.parse(reader.result);
      if(!d||!Array.isArray(d.habits)||!d.checks||typeof d.checks!=='object')throw new Error('형식');
      const validHabits=d.habits.every(h=>h&&typeof h.id==='string'&&typeof h.name==='string'&&typeof h.color==='string');
      if(!validHabits)throw new Error('습관');
      if(!confirm('현재 기록을 백업 파일의 기록으로 바꿀까요?\n복원 전 현재 기록을 백업해 두는 것을 권장해요.'))return;
      state={version:1,habits:d.habits,checks:d.checks};persist();render();showToast('기록을 복원했어요.');
    }catch(e){showToast('올바른 동그라미 습관 백업 JSON 파일이 아니에요.');}
    finally{$('importFile').value='';}
  };
  reader.onerror=()=>showToast('파일을 읽지 못했어요.');
  reader.readAsText(file);
}
$('prevMonth').addEventListener('click',()=>{shownMonth=new Date(shownMonth.getFullYear(),shownMonth.getMonth()-1,1);renderCalendar();});
$('nextMonth').addEventListener('click',()=>{shownMonth=new Date(shownMonth.getFullYear(),shownMonth.getMonth()+1,1);renderCalendar();});
$('todayBtn').addEventListener('click',()=>{const n=new Date();shownMonth=new Date(n.getFullYear(),n.getMonth(),1);selectedDate=todayKey();render();});
$('addHabitBtn').addEventListener('click',()=>openModal());$('manageAddBtn').addEventListener('click',()=>openModal());
$('cancelModalBtn').addEventListener('click',closeModal);$('saveHabitBtn').addEventListener('click',saveHabit);$('deleteHabitBtn').addEventListener('click',()=>{if(editingId)deleteHabit(editingId);});
$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal();});
$('exportBtn').addEventListener('click',exportData);$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',e=>importData(e.target.files&&e.target.files[0]));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modalBackdrop').classList.contains('hidden'))closeModal();});
render();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
})();
</script>
</body>
</html>
